<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; }
        .result-card { max-width: 700px; margin: 70px auto; border: 0; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.10); }
        .prediction { font-size: 42px; font-weight: 800; }
    </style>
</head>
<body>
<div class="container">
    <div class="card result-card p-5 text-center">
        <h2>🎓 Prediction Result</h2>
        <p class="text-muted">Student: <strong>{{ student_name }}</strong></p>

        <div class="my-4">
            <div class="text-muted">Predicted Performance</div>
            <div class="prediction text-primary">{{ prediction }}</div>
        </div>

        {% if probability is not none %}
        <p>Model confidence: <strong>{{ probability }}%</strong></p>
        {% endif %}

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="p-3 bg-light rounded">
                    <h5>{{ average_marks }}</h5>
                    <small>Average Marks</small>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 bg-light rounded">
                    <h5>{{ engagement_score }}</h5>
                    <small>Engagement Score</small>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-primary me-2">New Prediction</a>
            <a href="/dashboard" class="btn btn-outline-primary">Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
